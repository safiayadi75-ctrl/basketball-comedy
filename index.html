<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14204f">
<meta name="description" content="كوميديا كرة السلة: صفي يكسر أصبع مرام، ثم تبدأ حرب الانتقام">
<title>حادثة الملعب 🏀 صفي ومرام</title>
<style>
:root{--navy:#14204f;--navy2:#22338a;--orange:#ff8a3d;--gold:#ffd34d;--pink:#ff6fae;--text:#fffaf2}
*{box-sizing:border-box}
html{background:var(--navy);min-height:100%}
body{
  margin:0;min-height:100svh;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
  background:radial-gradient(ellipse at 50% -10%,#3b4fc4 0,transparent 55%),linear-gradient(170deg,#14204f,#1c2a6e 60%,#14204f);
  overflow-x:hidden
}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
main{width:min(100% - 24px,480px);margin:auto;padding:12px 0 calc(20px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.8rem}
.dots{display:flex;gap:6px}
.dots i{width:26px;height:6px;border-radius:9px;background:#ffffff30;transition:.3s}
.dots i.on{background:var(--orange);width:38px}
.ghost{background:#ffffff12;border:1px solid #ffffff2a;color:var(--text);border-radius:99px;padding:6px 12px;font-size:.78rem}
.page{display:none}
.page.active{display:block;animation:arrive .4s ease both}
@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kicker{text-align:center;color:var(--gold);font-size:.8rem;margin:12px 0 0;font-weight:700}
h1{margin:2px 0 8px;text-align:center;font-size:clamp(1.7rem,8vw,2.35rem);line-height:1.3;font-weight:900;
  background:linear-gradient(100deg,#fff,#ffd34d 55%,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 14px #ff8a3d55)}
.scene{border-radius:22px;overflow:hidden;border:2px solid #ffffff22;box-shadow:0 14px 40px #0006;background:#1b2a6b}
.scene svg{display:block;width:100%;height:auto}
.scene.quake{animation:quake .45s linear}
@keyframes quake{0%,100%{transform:translate(0,0)}15%{transform:translate(-7px,4px) rotate(-.6deg)}30%{transform:translate(6px,-4px) rotate(.6deg)}45%{transform:translate(-5px,3px)}60%{transform:translate(4px,-2px)}80%{transform:translate(-2px,1px)}}
.cap{min-height:3.3em;margin:10px 4px 6px;text-align:center;font-size:1rem;line-height:1.7;font-weight:700;color:#fff3d8}
.cap.in{animation:capin .35s ease both}
@keyframes capin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.btn{min-height:52px;border:0;border-radius:18px;padding:12px 22px;font-weight:900;font-size:1.05rem;color:#3a1a00;
  background:linear-gradient(105deg,#ffd34d,#ff8a3d);box-shadow:0 8px 24px #ff8a3d55;transition:transform .12s}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.55;filter:grayscale(.4)}
.btn.revenge{color:#fff;background:linear-gradient(105deg,#ff4d8d,#c2185b);box-shadow:0 8px 24px #ff4d8d55}
#heal{display:none;width:100%;font-size:1.25rem;min-height:60px;background:linear-gradient(105deg,#7dffb0,#21c97a);color:#053b22;box-shadow:0 8px 28px #21c97a66}
#heal.show{display:block;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both,glow 1.6s ease-in-out .5s infinite}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 8px 28px #21c97a66}50%{box-shadow:0 0 0 8px #21c97a33,0 10px 34px #21c97a99;transform:scale(1.03)}}
.score{display:flex;align-items:center;justify-content:center;gap:12px;margin:2px 0 10px}
.score div{display:flex;align-items:center;gap:8px;background:#ffffff14;border:1px solid #ffffff26;border-radius:16px;padding:6px 14px;font-weight:800}
.score b{font-size:1.9rem;min-width:1.2ch;text-align:center;color:var(--gold)}
.score i{font-style:normal;font-size:1.6rem;color:#ffffff88}
.score b.bump{animation:bump .4s ease}
@keyframes bump{40%{transform:scale(1.6);color:#fff}}
.hint{text-align:center;font-size:.76rem;color:#c7d0ff;margin:12px 0 0}
#card{position:fixed;inset:0;z-index:20;display:grid;place-items:center;text-align:center;padding:24px;
  background:radial-gradient(circle,#3b1a6e,#0c0f2b);opacity:0;pointer-events:none;transition:opacity .35s}
#card.show{opacity:1;pointer-events:auto}
#card .em{font-size:4.5rem;animation:wob 1s ease-in-out infinite alternate}
#card h2{font-size:clamp(1.8rem,9vw,2.6rem);margin:8px 0;color:var(--gold);line-height:1.4}
#card p{margin:0;color:#ffd7ea;font-size:1.05rem}
@keyframes wob{from{transform:rotate(-8deg) scale(1)}to{transform:rotate(8deg) scale(1.15)}}

/* ===== حالات الوجوه ===== */
.mood{display:none}
.ch[data-mood="normal"] .mood.normal,.ch[data-mood="shock"] .mood.shock,.ch[data-mood="angry"] .mood.angry,
.ch[data-mood="scared"] .mood.scared,.ch[data-mood="laugh"] .mood.laugh,.ch[data-mood="dizzy"] .mood.dizzy,
.ch[data-mood="calm"] .mood.calm,.ch[data-mood="blow"] .mood.blow{display:inline}
.idle{animation:idle 1.3s ease-in-out infinite alternate}
@keyframes idle{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.shake{transform-origin:0 288px}
.ch[data-mood="angry"] .shake{animation:rage .09s linear infinite alternate}
@keyframes rage{from{transform:translate(-2px,0)}to{transform:translate(2px,-3px)}}
.ch[data-mood="scared"] .shake{animation:tremble .07s linear infinite alternate}
@keyframes tremble{from{transform:translate(-1.4px,0)}to{transform:translate(1.4px,0)}}
.ch[data-mood="laugh"] .shake{animation:giggle .17s ease-in-out infinite alternate}
@keyframes giggle{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.ch[data-mood="dizzy"] .shake{animation:dizz .5s ease-in-out infinite alternate}
@keyframes dizz{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.steam circle{transform-box:fill-box;transform-origin:center;animation:rise 1s ease-out infinite}
.steam .s2{animation-delay:.33s;--sx:-8px}.steam .s3{animation-delay:.66s;--sx:8px}
@keyframes rise{0%{transform:translate(0,0) scale(.5);opacity:.95}100%{transform:translate(var(--sx,0),-30px) scale(1.6);opacity:0}}
.vein{transform-box:fill-box;transform-origin:center;animation:throb .32s ease-in-out infinite alternate}
@keyframes throb{to{transform:scale(1.4) rotate(10deg)}}
.sweat,.tear{animation:drip 1s ease-in infinite}
@keyframes drip{0%{transform:translateY(-3px);opacity:0}30%{opacity:1}100%{transform:translateY(16px);opacity:0}}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hearts text{transform-box:fill-box;transform-origin:center;animation:hup 1.8s ease-out infinite}
.hearts .h2{animation-delay:.9s}
@keyframes hup{0%{transform:translateY(8px) scale(.4);opacity:0}30%{opacity:1}100%{transform:translateY(-24px) scale(1);opacity:0}}
.ch.walk .leg{animation:legs .26s ease-in-out infinite alternate}
.ch.walk .leg.r{animation-direction:alternate-reverse}
@keyframes legs{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.scene text{font-family:inherit}
@media(max-height:720px){.cap{min-height:2.8em;font-size:.95rem}}
@media(prefers-reduced-motion:reduce){.scene.quake{animation:none}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="dots" aria-hidden="true"><i class="on" id="d1"></i><i id="d2"></i></div>
    <button class="ghost" id="restart">↺ من البداية</button>
  </div>

  <!-- الصفحة 1: الحادثة -->
  <section class="page active" id="p1">
    <p class="kicker">الحلقة الأولى</p>
    <h1>حادثة الملعب 🏀🤕</h1>
    <div class="scene" id="sc1"></div>
    <p class="cap" id="cap1"></p>
    <button class="btn" id="heal">اضغط للشفاء 🩹</button>
  </section>

  <!-- الصفحة 2: الانتقام -->
  <section class="page" id="p2">
    <p class="kicker">الحلقة الثانية</p>
    <h1>ثأر مرام ⚔️🏀</h1>
    <div class="score" aria-live="polite">
      <div><b id="scG">0</b><span>مرام 😈</span></div><i>:</i><div><b id="scB">0</b><span>صفي 😎</span></div>
    </div>
    <div class="scene" id="sc2"></div>
    <p class="cap" id="cap2"></p>
    <div class="row">
      <button class="btn" id="bB">🏀 صفي يرمي</button>
      <button class="btn revenge" id="bG">😈 ثأر مرام!</button>
    </div>
    <p class="hint">الحرب تستمر وحدها… أو اضغط الأزرار لتزيد النار 🔥</p>
  </section>
</main>

<div id="card" aria-live="polite"><div><div class="em" id="cardEm">😈</div><h2 id="cardH"></h2><p id="cardP"></p></div></div>

function makeScene(host,n,opt){
  opt=opt||{};
  host.innerHTML=`
  <svg viewBox="0 0 360 350" role="img" aria-label="مشهد كوميدي متحرك لصفي ومرام مع كرة السلة">
   <defs>
    <linearGradient id="wall${n}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26379b"/><stop offset="1" stop-color="#3a4fc9"/></linearGradient>
    <linearGradient id="floor${n}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d98c45"/><stop offset="1" stop-color="#a8622a"/></linearGradient>
    <clipPath id="zc${n}"><circle r="45"/></clipPath>
    <g id="bl${n}">
      <circle r="9" fill="#ff8a3d" stroke="#8c3a0f" stroke-width="1.2"/>
      <path d="M-9 0H9M0 -9V9" stroke="#8c3a0f" stroke-width="1.1" fill="none"/>
      <path d="M-6.4 -6.4Q0 0 -6.4 6.4M6.4 -6.4Q0 0 6.4 6.4" stroke="#8c3a0f" stroke-width="1.1" fill="none"/>
      <ellipse cx="-3" cy="-4" rx="2.4" ry="1.4" fill="#fff" opacity=".4"/>
    </g>
   </defs>
   <g class="root" transform="translate(0,40)">
    <rect x="-10" y="-50" width="380" height="340" fill="url(#wall${n})"/>
    <g opacity=".13" fill="#fff"><circle cx="40" cy="60" r="2"/><circle cx="320" cy="40" r="2"/><circle cx="110" cy="-10" r="1.6"/><circle cx="260" cy="10" r="1.6"/></g>
    <rect x="-10" y="286" width="380" height="80" fill="url(#floor${n})"/>
    <rect x="-10" y="286" width="380" height="3" fill="#ffe0b0" opacity=".7"/>
    <g stroke="#fff" stroke-opacity=".22" stroke-width="2" fill="none"><path d="M-10 312H370M-10 338H370"/><ellipse cx="180" cy="300" rx="120" ry="14"/></g>
    <g class="L-piles"></g>
    <g class="L-chars"></g>
    <g class="L-balls"></g>
    <g class="L-zoom"></g>
    <g class="L-bubbles"></g>
    <g class="L-parts"></g>
   </g>
  </svg>`;
  const svg=host.querySelector('svg');
  const q=s=>svg.querySelector(s);
  const L={chars:q('.L-chars'),balls:q('.L-balls'),zoom:q('.L-zoom'),bubbles:q('.L-bubbles'),parts:q('.L-parts'),piles:q('.L-piles')};

  const S={host,svg};
  function mk(svgStr,x){
    const g=el('g',{transform:`translate(${x},0)`},L.chars); g.innerHTML=svgStr;
    const ch=g.querySelector('.ch'),mv=g.querySelector('.mv');
    mv.style.transformOrigin='0px 288px';
    return {ch,mv,armF:g.querySelector('.armF'),armB:g.querySelector('.armB'),fing:g.querySelector('.fing'),x,base:x,off:0,bub:null};
  }
  S.boy=mk(boySVG(),62); S.girl=mk(girlSVG(),298);

  if(opt.piles){
    [[16,277],[36,277],[26,260]].forEach(p=>{const g=el('g',{transform:`translate(${p[0]},${p[1]})`},L.piles);el('use',{href:'#bl'+n},g)});
    [[344,277],[324,277],[334,260]].forEach(p=>{const g=el('g',{transform:`translate(${p[0]},${p[1]})`},L.piles);el('use',{href:'#bl'+n},g)});
  }
  L.zoom.innerHTML=zoomSVG(n);
  const Zg=L.zoom.querySelector('.zoom'),Zin=L.zoom.querySelector('.zin');

  /* فقاعة كلام */
  S.say=function(who,text,ms){
    ms=ms||1800;const c=S[who];if(c.bub)c.bub.remove();
    const outer=el('g',{},L.bubbles),inner=el('g',{},outer);
    const t=el('text',{'text-anchor':'middle','font-size':13,'font-weight':800,fill:who==='boy'?'#1d3a8a':'#c2306f'},inner);t.textContent=text;
    const bb=t.getBBox(),w=bb.width+22,h=bb.height+10;
    const gx=Math.max(w/2+4,Math.min(356-w/2,c.x));
    const tx=Math.max(-w/2+14,Math.min(w/2-14,c.x-gx)),by=bb.y-5+h;
    const rect=el('rect',{x:-w/2,y:bb.y-5,width:w,height:h,rx:h/2,fill:'#fff',stroke:'#0003','stroke-width':1});
    const tail=el('path',{d:`M${tx-6} ${by-1}L${tx+6} ${by-1}L${tx} ${by+8}Z`,fill:'#fff'});
    inner.insertBefore(tail,t);inner.insertBefore(rect,tail);
    outer.setAttribute('transform',`translate(${gx},74)`);
    inner.style.transformOrigin=`${tx}px ${by+8}px`;
    inner.animate([{transform:'scale(.3)',opacity:0},{transform:'scale(1.1)',opacity:1,offset:.7},{transform:'scale(1)',opacity:1}],{duration:260,fill:'forwards'});
    c.bub=outer;setTimeout(()=>{if(c.bub===outer){outer.remove();c.bub=null}},ms);
  };
  /* نص طافٍ */
  S.float=function(x,y,txt,o){
    o=Object.assign({size:16,color:'#fff',dx:0,dy:-36,dur:1100},o);
    const t=el('text',{x,y,'text-anchor':'middle','font-size':o.size,'font-weight':900,fill:o.color,stroke:'#0007','stroke-width':.7},L.parts);t.textContent=txt;
    t.animate([{transform:'translate(0,0)',opacity:0},{opacity:1,offset:.2},{transform:`translate(${o.dx}px,${o.dy}px)`,opacity:0}],{duration:o.dur,easing:'ease-out'}).finished.then(()=>t.remove()).catch(()=>t.remove());
  };
  /* نجمة تأثير */
  S.burst=function(x,y,txt,col){
    const o=el('g',{transform:`translate(${x},${y})`},L.parts),i=el('g',{},o);
    let pts='';for(let k=0;k<16;k++){const r=k%2?18:29,a=k*Math.PI/8;pts+=`${(Math.cos(a)*r).toFixed(1)},${(Math.sin(a)*r).toFixed(1)} `}
    el('polygon',{points:pts,fill:'#ffe14d',stroke:'#fff','stroke-width':1.5},i);
    const t=el('text',{y:5,'text-anchor':'middle','font-size':14,'font-weight':900,fill:col||'#e0204f',stroke:'#fff','stroke-width':.5},i);t.textContent=txt;
    i.animate([{transform:'scale(.2) rotate(-20deg)',opacity:0},{transform:'scale(1.25) rotate(6deg)',opacity:1,offset:.3},{transform:'scale(1) rotate(0deg)',opacity:1,offset:.7},{transform:'scale(1.1)',opacity:0}],{duration:900}).finished.then(()=>o.remove()).catch(()=>o.remove());
  };
  /* كرة */
  const resting=[];
  const par=(a,b,t,H)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t-H*4*t*(1-t)});
  function flight(b,a,c,o){
    o=Object.assign({H:60,dur:800,spin:720,sc:1},o);const kf=[];
    for(let i=0;i<=24;i++){const t=i/24,p=par(a,c,t,o.H);kf.push({transform:`translate(${p.x}px,${p.y}px) rotate(${o.spin*t}deg) scale(${o.sc})`})}
    return b.animate(kf,{duration:o.dur,easing:'linear',fill:'forwards'}).finished.catch(()=>{});
  }
  S.newBall=function(){const g=el('g',{},L.balls);el('use',{href:'#bl'+n},g);return g};
  S.flight=flight;
  S.settle=async function(b,x0,y0){
    const x1=Math.max(18,Math.min(342,x0+(Math.random()*90-45))),gy=277,kf=[];
    for(let i=0;i<=10;i++){const t=i/10;kf.push({transform:`translate(${x0+(x1-x0)*t}px,${y0+(gy-y0)*t*t}px) rotate(${200*t}deg)`})}
    await b.animate(kf,{duration:450,easing:'linear',fill:'forwards'}).finished.catch(()=>{});
    await flight(b,{x:x1,y:gy},{x:x1+14,y:gy},{H:22,dur:320,spin:120});
    await flight(b,{x:x1+14,y:gy},{x:x1+20,y:gy},{H:7,dur:200,spin:50});
    resting.push(b);while(resting.length>9)resting.shift().remove();
  };
  /* تحريك شخصية */
  S.moveTo=async function(c,off,dur){
    c.ch.classList.add('walk');
    await A(c.mv,[{transform:`translate(${c.off}px,0px)`},{transform:`translate(${off}px,0px)`}],{duration:dur||900});
    c.off=off;c.x=c.base+off;c.ch.classList.remove('walk');
  };
  /* العدسة المكبّرة */
  const zq=s=>Zg.querySelector(s);
  S.zoom={
    show(){Zg.style.display='inline';Zin.animate([{transform:'scale(.2) rotate(-12deg)',opacity:0},{transform:'scale(1.1)',opacity:1,offset:.7},{transform:'scale(1)',opacity:1}],{duration:380,fill:'forwards'})},
    async hide(){await A(Zin,[{transform:'scale(1)',opacity:1},{transform:'scale(.2)',opacity:0}],{duration:250});Zg.style.display='none'},
    f:zq('.zf'),bruise:zq('.zbruise'),plaster:zq('.zplaster'),crack:zq('.zcrack'),txt:zq('.ztxt'),
    wind(){Zg.querySelectorAll('.zw').forEach((p,i)=>p.animate([{transform:'translateX(-26px)',opacity:0},{opacity:.95,offset:.3},{transform:'translateX(56px)',opacity:0}],{duration:800,delay:i*160,iterations:3,easing:'ease-out'}))}
  };
  S.shake=function(){S.host.classList.remove('quake');void S.host.offsetWidth;S.host.classList.add('quake');setTimeout(()=>S.host.classList.remove('quake'),480)};
  return S;
}

  tg.ch.dataset.mood='dizzy';
  S.settle(ball,b.x,b.y);

  await sleep(revenge?1000:700);
  tg.ch.dataset.mood='laugh';th.ch.dataset.mood='laugh';

  S2=makeScene(host2,2,{piles:true});
  $('#bB').disabled=false;$('#bG').disabled=false;
  cap(cap2,'مرام تثأر لأصبعها… وصفي يدافع عن نفسه بالضحك 😂');
  const g=token;
  try{
    await sleep(900);
    S2.girl.ch.dataset.mood='laugh';S2.boy.ch.dataset.mood='laugh';
    S2.say('girl','حان وقت الانتقام! 😈',1700);
    await sleep(1600);
    const caps=['حرب الكرات بدأت! لا أحد يسلم 🏀💥','مرام تتقدم بالنقاط… لا، صفي يعود! 😂','كلاهما يضحك والكرات تتطاير 🤣','الأصبع تشفى والكرامة لا! 😎'];
    let ci=0;
    while(g===token){
      if(!busy&&Date.now()-lastUser>3500){
        busy=true;setBtns();
        cap(cap2,caps[ci++%caps.length]);
        await throwBall(S2,Math.random()<.55?'girl':'boy',false);
        busy=false;setBtns();
      }
      await sleep(900+Math.random()*700);
    }
  }catch(e){if(e.message!=='cancel')console.error(e)}
}
function setBtns(){$('#bB').disabled=busy;$('#bG').disabled=busy}
async function manual(from,revenge){
  if(busy||page!==2)return;busy=true;lastUser=Date.now();setBtns();
  if(revenge)cap(cap2,'ضربة الانتقام الكبرى!! ثلاث نقاط 😈💥');
  try{await throwBall(S2,from,revenge)}catch(e){if(e.message!=='cancel')console.error(e)}
  busy=false;lastUser=Date.now();setBtns();
}
$('#bB').addEventListener('click',()=>manual('boy',false));
$('#bG').addEventListener('click',()=>manual('girl',true));
$('#restart').addEventListener('click',start1);

start1();
})();
</script>
